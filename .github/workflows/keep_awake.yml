name: 24/7 Render Keep Alive Ping

on:
  schedule:
    # Runs every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping CineVault on Render
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging CineVault Render Service to keep it 24/7 awake..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://cinevault-ucw6.onrender.com/api/health)
          echo "Response HTTP Status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ]; then
            echo "SUCCESS: CineVault is awake and healthy!"
          else
            echo "NOTICE: Received HTTP $RESPONSE"
          fi
